services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scratchlab
      POSTGRES_USER: scratchlab
      POSTGRES_PASSWORD: scratchlab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scratchlab -d scratchlab"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: ["scratchlab-db:/var/lib/postgresql/data"]
  api:
    build: {context: ., dockerfile: docker/api.Dockerfile}
    environment:
      DATABASE_URL: postgresql+psycopg://scratchlab:scratchlab@db:5432/scratchlab
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: {context: ., dockerfile: docker/web.Dockerfile}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  scratchlab-db:
